name: Philibert lookup (Stage 4 + Stage 5)

# Stage 4 (real per-product Zatu EANs) then Stage 5 (Philibert lookup + advantage filter) for
# the Stage 2 survivors. Both need real network access this coding sandbox doesn't have.
# ~576 survivors x up to ~4 requests each (1 Zatu EAN fetch + up to 3 Philibert calls) at a
# 1s/request courtesy rate limit -> comfortably under an hour, but this is genuinely slow, so
# it's manual-dispatch only, not on every push.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Stage 4 - enrich survivors with real EANs
        run: python scripts/enrich_zatu_ean.py --matched data/matched_games.json --out data/matched_games.json
      - name: Stage 5 - Philibert lookup + advantage filter
        run: python scripts/lookup_philibert.py --matched data/matched_games.json
      - name: Stage 6 - composite scoring
        run: python scripts/score_games.py
      - name: Stage 7 - render static HTML report
        run: python scripts/render_html.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matched_games.json data/philibert_results.json data/shortlist.json data/scored_games.json docs/index.html
          git diff --cached --quiet || git commit -m "Update Philibert lookup + shortlist + report [skip ci]"
          git push
