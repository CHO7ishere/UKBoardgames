name: Probe Philibert search + stock wording (diagnostic)

# One-off diagnostic, not part of the production pipeline: confirms Philibert's real search
# endpoint and stock-status wording before Stage 5 is built against it for real. Read the
# results in the job log — nothing is committed.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/probe_philibert.py
