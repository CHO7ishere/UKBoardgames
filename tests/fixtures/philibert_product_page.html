<!DOCTYPE html>
<html>
<head><title>Athlètes de Compète</title></head>
<body>
  <div class="product-prices">
    <span class="current-price">26,90€</span>
  </div>
  <div class="product-actions">
    Précommande : Fin aout/début septembre
  </div>
  <ul class="product-features">
    <li class="product-features__item">
      <span class="product-features__name">Langue(s)</span>
      <span class="product-features__value">Français</span>
    </li>
    <li class="product-features__item">
      <span class="product-features__name">EAN</span>
      <span class="product-features__value">3701551706461</span>
    </li>
    <li class="product-features__item">
      <span class="product-features__name">Editeur</span>
      <span class="product-features__value">Iello</span>
    </li>
  </ul>
  <!-- Cross-sell widget: unrendered template leakage + a genuinely unrelated accessory that
       really is out of stock. Must NOT be picked up as the primary product's stock signal. -->
  <div class="cross-sell-widget">
    product.oos product.declinaisons
    <div class="accessory-card">
      Kit de pochettes pour Athlètes de Compète 3,59€ Indisponible
    </div>
  </div>
</body>
</html>
